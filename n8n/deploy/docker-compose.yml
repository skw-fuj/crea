# CREA v3 — the whole stack, one file.
#
#   cd ..
#   ./go-live.sh                  # fills config, brings this up, imports + activates everything
#
# Services (all restart:unless-stopped + a healthcheck, so they survive a reboot and a hang
# once Docker Desktop is set to "Start Docker Desktop when you sign in"):
#   n8n        the automation engine + editor UI          http://localhost:5678
#   waha       WhatsApp gateway (scan the QR once)         http://localhost:3001
#   vault-api  CREA's memory + health: knowledge, state…   internal only (:5692, /status.html)
#
# No public URL / tunnel is needed: WhatsApp talks to n8n on the internal Docker network,
# and Acuity is polled outbound every 10 min by crea-03, not via a webhook.
# The host watchdog (./go-live.sh installs it) restarts anything the healthcheck marks unhealthy.

name: crea

services:
  n8n:
    image: n8nio/n8n:2.30.7
    container_name: crea-n8n
    restart: unless-stopped
    ports:
      - "${CREA_N8N_PORT:-5678}:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?run ./go-live.sh (it generates and stores this in deploy/.n8n-key)}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:${CREA_N8N_PORT:-5678}/
      - GENERIC_TIMEZONE=${CREA_TIMEZONE:-Australia/Sydney}
      - TZ=${CREA_TIMEZONE:-Australia/Sydney}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_SECURE_COOKIE=false
      - N8N_RUNNERS_ENABLED=true
      - N8N_HIRING_BANNER_ENABLED=false
      # keep the SQLite db from growing without bound
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=20000
      # optional editor login — set CREA_N8N_USER + CREA_N8N_PASSWORD in config.env
      - N8N_BASIC_AUTH_ACTIVE=${CREA_N8N_AUTH_ACTIVE:-false}
      - N8N_BASIC_AUTH_USER=${CREA_N8N_USER:-}
      - N8N_BASIC_AUTH_PASSWORD=${CREA_N8N_PASSWORD:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./_filled:/workflows:ro
      - ./_export:/export
    depends_on:
      vault-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 4
      start_period: 60s

  waha:
    # go-live.sh picks the image + engine by CPU architecture (WAHA ships separate
    # amd64 / arm64 images, and the arm64 build is NOWEB-only — no Chromium).
    image: ${CREA_WAHA_IMAGE:-devlikeapro/waha:noweb}
    container_name: crea-waha
    restart: unless-stopped
    ports:
      - "${CREA_WAHA_PORT:-3001}:3000"
    environment:
      - WAHA_API_KEY=${CREA_WAHA_API_KEY:?set CREA_WAHA_API_KEY in config.env}
      - WHATSAPP_DEFAULT_ENGINE=${CREA_WAHA_ENGINE:-NOWEB}
      - WHATSAPP_HOOK_URL=http://n8n:5678/webhook/crea-wa-inbound
      - WHATSAPP_HOOK_EVENTS=message
      - WHATSAPP_RESTART_ALL_SESSIONS=true
      - TZ=${CREA_TIMEZONE:-Australia/Sydney}
    volumes:
      - waha_sessions:/app/.sessions
    # no container healthcheck for WAHA — "port up" says nothing about whether WhatsApp is
    # actually linked. The host watchdog checks the real signal (session status == WORKING)
    # and re-links a dropped session.

  vault-api:
    image: node:20-alpine
    container_name: crea-vault-api
    restart: unless-stopped
    working_dir: /app
    command: node server.js
    environment:
      - VAULT_API_PORT=5692
      - VAULT_DIR=/vault
      - KNOWLEDGE_FILE=/knowledge/crea-knowledge.md
      - BACKUP_DIR=/backups
      - ACUITY_USER_ID=${CREA_ACUITY_USER_ID:-}
      - ACUITY_API_KEY=${CREA_ACUITY_API_KEY:-}
      - ACUITY_APPT_TYPE_ID=${CREA_ACUITY_APPT_TYPE_ID:-}
      - LLM_CIRCUIT_FAILS=${LLM_CIRCUIT_FAILS:-4}
      - LLM_CIRCUIT_COOLDOWN_S=${LLM_CIRCUIT_COOLDOWN_S:-300}
    volumes:
      - ../vault-api:/app:ro
      - ../knowledge:/knowledge:ro
      - ../backups:/backups:ro
      - ${CREA_VAULT_DIR_ABS:-crea_vault}:/vault
    # bound to localhost only — for the health dashboard at http://localhost:5692/status.html
    ports:
      - "127.0.0.1:${CREA_VAULT_PORT:-5692}:5692"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5692/ping || exit 1"]
      interval: 30s
      timeout: 6s
      retries: 4
      start_period: 10s

volumes:
  n8n_data:
  waha_sessions:
  crea_vault:
